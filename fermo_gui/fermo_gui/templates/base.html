<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ block.title }} Kapelczak FERMO {{ endblock }}</title>

  <!-- Tailwind CSS -->
  <link href="{{ url_for('static', filename='css/tailwind.css') }}" rel="stylesheet">

  <!-- Flowbite -->
  <script src="{{ url_for('static', filename='js/flowbite.min.js') }}"></script>

  <!-- Favicon -->
  <link rel="icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
</head>
<body class="flex flex-col min-h-screen bg-gray-50 text-gray-900">

  <!-- Navbar -->
  <header>
    <nav class="bg-white border-b border-gray-200 px-4 py-3">
      <div class="container mx-auto flex flex-wrap items-center justify-between">
        <a href="{{ url_for('routes.index') }}" class="flex items-center space-x-3 rtl:space-x-reverse">
          <img src="{{ url_for('static', filename='images/logo.png') }}" class="h-10" alt="Kapelczak Logo">
          <span class="self-center text-xl font-semibold whitespace-nowrap">Kapelczak FERMO</span>
        </a>
      </div>
    </nav>
  </header>

  <!-- Main content -->
  <main class="flex-grow container mx-auto py-6 px-4">
    {{ block content }}
    {{ endblock }}
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-gray-200 shadow-sm mt-6">
    <div class="container mx-auto px-4 py-4 text-center text-sm text-gray-600">
      &copy; 2025 Kapelczak. All rights reserved.
    </div>
  </footer>

</body>
</html>
